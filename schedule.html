    <main class="page-section">
        <div class="container">
            <section>
                <h1 data-aos="fade-up" class="text-center mb-4">Programar Recogida</h1>
            <form action="submit.php" method="post" class="row g-3">
                <div class="col-md-6">
                    <label for="email" class="form-label">Correo Electrónico *</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="col-md-6">
                    <label for="phone" class="form-label">Número de WhatsApp *</label>
                    <input type="tel" class="form-control" id="phone" name="phone" required>
                </div>
                <div class="col-12">
                    <label for="address" class="form-label">Dirección Completa *</label>
                    <input type="text" class="form-control" id="address" name="address" required>
                </div>
                <div class="col-md-6">
                    <label for="city" class="form-label">Ciudad *</label>
                    <select class="form-select" id="city" name="city" required>
                        <option value="">Selecciona una ciudad</option>
                        <option value="Bogota">Bogotá</option>
                        <option value="Medellin">Medellín</option>
                        <option value="Cali">Cali</option>
                        <option value="Barranquilla">Barranquilla</option>
                        <option value="Cartagena">Cartagena</option>
                        <option value="Bucaramanga">Bucaramanga</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="items" class="form-label">¿Qué vas a donar? *</label>
                    <textarea class="form-control" id="items" name="items" rows="3" required></textarea>
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="privacy" required>
                        <label class="form-check-label" for="privacy">
                            Acepto la <a href="privacy.html">Política de Privacidad</a>
                        </label>
                    </div>
                </div>
                <div class="col-12 text-center">
                    <button type="submit" class="btn btn-lg">Programar Recogida</button>
                </div>
            </form>
        </section>
        </div>
    </main>
